<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12625a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="支出手帳">
  <meta name="description" content="端末内だけで使える個人向け支出手帳">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>支出手帳</title>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="app-header">
    <div><p class="eyebrow">端末内に保存</p><h1 id="page-title">ホーム</h1></div>
    <div class="header-actions">
      <button id="scan-button" class="icon-button" type="button" aria-label="レシートを撮影して自動入力">▣</button>
      <button id="add-button" class="icon-button primary" type="button" aria-label="支出を手入力で追加">＋</button>
    </div>
    <input id="receipt-image" class="sr-only" type="file" accept="image/*" capture="environment">
  </header>

  <main id="main" tabindex="-1">
    <section id="home-view" class="view active" aria-labelledby="page-title"></section>
    <section id="history-view" class="view" aria-labelledby="page-title"></section>
    <section id="analysis-view" class="view" aria-labelledby="page-title"></section>
    <section id="question-view" class="view" aria-labelledby="page-title"></section>
  </main>

  <nav class="tab-bar" aria-label="メインメニュー">
    <button type="button" data-tab="home" class="selected" aria-current="page"><span aria-hidden="true">⌂</span><span>ホーム</span></button>
    <button type="button" data-tab="history"><span aria-hidden="true">☷</span><span>履歴</span></button>
    <button type="button" data-tab="analysis"><span aria-hidden="true">▥</span><span>分析</span></button>
    <button type="button" data-tab="question"><span aria-hidden="true">?</span><span>質問</span></button>
  </nav>

  <dialog id="expense-dialog" aria-labelledby="form-title">
    <form id="expense-form" method="dialog" novalidate>
      <div class="dialog-header"><button type="button" id="cancel-form" class="text-button">キャンセル</button><h2 id="form-title">支出を追加</h2><button type="submit" id="save-form" class="text-button strong">保存</button></div>
      <input type="hidden" id="expense-id">
      <label>利用日<span class="required">必須</span><input id="expense-date" type="date" required><span id="date-error" class="field-error" role="alert"></span></label>
      <label>店名<input id="merchant" type="text" maxlength="100" placeholder="未入力時は「店名なし」"></label>
      <label>合計金額<span class="required">必須</span><div class="money-input"><span>¥</span><input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div><span id="amount-error" class="field-error" role="alert"></span></label>
      <label>カテゴリ<select id="category"></select><span id="category-error" class="field-error" role="alert"></span></label>
      <label>支払方法<select id="payment"></select></label>
      <label>メモ<textarea id="memo" maxlength="500" rows="4"></textarea></label>
      <div id="save-error" class="error-panel" role="alert" hidden></div>
    </form>
  </dialog>

  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <article><div class="dialog-header"><button type="button" id="close-detail" class="text-button">閉じる</button><h2 id="detail-title">支出の詳細</h2><span></span></div><div id="detail-content"></div><div class="button-row"><button id="edit-expense" type="button">編集</button><button id="delete-expense" type="button" class="danger">削除</button></div></article>
  </dialog>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <article><h2 id="confirm-title">支出を削除しますか？</h2><p id="confirm-message"></p><div class="button-row"><button id="cancel-delete" type="button">キャンセル</button><button id="confirm-delete" type="button" class="danger">削除</button></div></article>
  </dialog>

  <dialog id="ocr-dialog" aria-labelledby="ocr-title">
    <article>
      <div class="dialog-header"><button type="button" id="cancel-ocr" class="text-button">閉じる</button><h2 id="ocr-title">レシートを読み取り</h2><span></span></div>
      <img id="receipt-preview" class="receipt-preview" alt="選択したレシート画像">
      <div id="ocr-progress" class="ocr-progress" role="status" aria-live="polite"><progress id="ocr-progress-bar" max="100" value="0"></progress><p>OCRを準備しています…</p></div>
      <div id="ocr-error" class="error-panel" role="alert" hidden></div>
      <div id="ocr-results" hidden>
        <p id="ocr-confidence" class="muted caption"></p>
        <label>店名候補<select id="ocr-merchant-select"></select></label>
        <label id="ocr-merchant-manual-label" hidden>店名を手入力<input id="ocr-merchant-manual" type="text" maxlength="100"></label>
        <label>利用日<select id="ocr-date-select"></select></label>
        <label>金額候補<select id="ocr-amount-select"></select><span class="muted caption">レシートの合計と一致する候補を選んでください。保存直前にも確認します。</span></label>
        <label>カテゴリ<select id="ocr-category-select"></select><span id="ocr-category-reason" class="muted caption"></span></label>
        <label>支払方法<select id="ocr-payment-select"></select></label>
        <details><summary>OCR原文を確認</summary><textarea id="ocr-raw-text" rows="8" readonly></textarea></details>
        <button id="apply-ocr" type="button" class="primary wide-button">入力画面で最終確認</button>
      </div>
    </article>
  </dialog>

  <dialog id="amount-confirm-dialog" aria-labelledby="amount-confirm-title">
    <article><h2 id="amount-confirm-title">金額を最終確認</h2><p>レシート記載の合計金額と一致していますか？</p><p id="amount-confirm-value" class="hero-amount"></p><div class="button-row"><button id="cancel-amount-confirm" type="button">入力へ戻る</button><button id="accept-amount-confirm" type="button" class="primary">この金額で登録</button></div></article>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="error-panel">このアプリを使うにはJavaScriptを有効にしてください。</p></noscript>
  <script src="./vendor/ocr/tesseract.min.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
